<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PROFITBRIDGE | Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f1f4f9;
    color: #172033;
}

header {
    background: #101d35;
    color: white;
    padding: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.logo span {
    color: #16c784;
}

.profile {
    background: #243653;
    padding: 10px;
    border-radius: 8px;
    font-size: 12px;
}

.container {
    display: flex;
}

.sidebar {
    width: 230px;
    background: #101d35;
    min-height: 100vh;
    padding: 20px;
}

.sidebar a {
    display: block;
    color: #cbd5e1;
    text-decoration: none;
    padding: 15px;
    margin-bottom: 8px;
    border-radius: 7px;
}

.sidebar a:hover,
.sidebar a.active {
    background: #16a875;
    color: white;
}

.main {
    flex: 1;
    padding: 25px;
    min-width: 0;
}

.welcome {
    margin-bottom: 25px;
}

.welcome h2 {
    margin-bottom: 8px;
}

.demo {
    background: #fff3cd;
    color: #795600;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-size: 13px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,0.04);
}

.card p {
    color: #778197;
    font-size: 13px;
    margin-bottom: 12px;
}

.card h2 {
    font-size: 23px;
}

.green {
    color: #16a875;
}

.actions {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

button:disabled {
    opacity: .6;
    cursor: not-allowed;
}

.deposit {
    background: #16a875;
    color: white;
}

.withdraw {
    background: #101d35;
    color: white;
}

.section {
    background: white;
    padding: 22px;
    border-radius: 12px;
    margin-bottom: 22px;
}

.section h3 {
    margin-bottom: 18px;
}

.plans {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
}

.plan {
    border: 1px solid #e4e8ef;
    padding: 18px;
    border-radius: 10px;
}

.plan h4 {
    margin-bottom: 12px;
}

.plan p {
    color: #778197;
    font-size: 13px;
    margin-bottom: 12px;
}

.plan button {
    width: 100%;
    background: #16a875;
    color: white;
}

input {
    padding: 12px;
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 7px;
    margin: 10px 0;
}

table {
    width: 100%;
    border-collapse: collapse;
}

th, td {
    text-align: left;
    padding: 13px 8px;
    border-bottom: 1px solid #eee;
    font-size: 13px;
}

th {
    color: #778197;
}

footer {
    text-align: center;
    padding: 20px;
    color: #888;
}

#notice {
    padding: 12px;
    margin-bottom: 15px;
    border-radius: 7px;
    display: none;
    background: #e0f8ed;
    color: #087a49;
}

@media(max-width: 900px) {
    .cards {
        grid-template-columns: repeat(2, 1fr);
    }

    .plans {
        grid-template-columns: 1fr;
    }
}

@media(max-width: 600px) {
    .sidebar {
        width: 75px;
        padding: 8px;
    }

    .sidebar a {
        font-size: 11px;
        padding: 12px 3px;
        text-align: center;
    }

    .main {
        padding: 12px;
    }

    .cards {
        gap: 8px;
    }

    .card {
        padding: 13px;
    }

    .card h2 {
        font-size: 17px;
    }

    .logo {
        font-size: 16px;
    }
}
</style>
</head>

<body>

<header>

    <div class="logo">
        PROFIT<span>BRIDGE</span>
    </div>

    <div class="profile">
        👤 <span id="userEmail">Loading...</span>
        <button onclick="logout()" style="margin-left:8px;padding:7px;">
            Logout
        </button>
    </div>

</header>

<div class="container">

<nav class="sidebar">

    <a href="#" class="active">🏠 Home</a>
    <a href="#investment">💼 Investment</a>
    <a href="#transactions">📊 Transactions</a>
    <a href="#wallet">💳 Wallet</a>
    <a href="#support">💬 Support</a>
    <a href="#account">⚙️ Account</a>

</nav>

<main class="main">

    <div class="welcome">
        <h2>Welcome Back!</h2>
        <p>Here's an overview of your demo account.</p>
    </div>

    <div class="demo">
        DEMO MODE: All figures and transactions are simulated.
        No real money is deposited or invested
