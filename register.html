<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | PROFITBRIDGE</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            color: #071b35;
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #172033;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-bottom: 18px;
            outline: none;
        }

        input:focus {
            border-color: #13b981;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #13b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0e9f6e;
        }

        button:disabled {
            opacity: 0.6;
        }

        .login-link {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
            color: #64748b;
        }

        .login-link a {
            color: #13b981;
            text-decoration: none;
            font-weight: bold;
        }

        .notice {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }

        #message {
            text-align: center;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">PROFITBRIDGE</div>

    <h2>Create Your Account</h2>

    <p class="subtitle">
        Register for your demo account
    </p>

    <p id="message"></p>

    <form id="registerForm">

        <label>Full Name</label>
        <input type="text" id="fullName"
        placeholder="Enter your full name" required>

        <label>Email Address</label>
        <input type="email" id="email"
        placeholder="Enter your email" required>

        <label>Username</label>
        <input type="text" id="username"
        placeholder="Choose a username" required>

        <label>Password</label>
        <input type="password" id="password"
        placeholder="Create a password" minlength="6" required>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword"
        placeholder="Confirm your password" required>

        <button type="submit" id="submitButton">
            Create Account
        </button>

    </form>

    <div class="login-link">
        Already have an account?
        <a href="login.html">Login</a>
    </div>

    <p class="notice">
        This registration is for a demonstration platform.
        No real-money investment or returns are offered.
    </p>

</div>

<script type="module">

import { createClient } from
'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL =
'https://lypclqsgqxsmihsarltm.supabase.co';

const SUPABASE_KEY =
'sb_publishable_fPvhDn0iuyrKxlC9TKX9dw_tRGoUUEI';

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form = document.getElementById('registerForm');
const message = document.getElementById('message');
const button = document.getElementById('submitButton');

form.addEventListener('submit', async function(event) {

    event.preventDefault();

    const fullName =
    document.getElementById('fullName').value.trim();

    const email =
    document.getElementById('email').value.trim();

    const username =
    document.getElementById('username').value.trim().toLowerCase();

    const password =
    document.getElementById('password').value;

    const confirmPassword =
    document.getElementById('confirmPassword').value;

    if (password !== confirmPassword) {
        message.style.color = 'red';
        message.textContent = 'Passwords do not match.';
        return;
    }

    if (!/^[a-z0-9_]{3,20}$/.test(username)) {
        message.style.color = 'red';
        message.textContent =
        'Username must be 3-20 letters, numbers or underscores.';
        return;
    }

    button.disabled = true;
    button.textContent = 'Creating Account...';

    try {

        const { data, error } = await supabase.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    full_name: fullName,
                    username: username
                }
            }

        });

        if (error) throw error;

        if (data.session) {

            const { error: profileError } =
            await supabase.from('profiles').upsert({

                id: data.user.id,
                full_name: fullName,
                username: username,
                email: email

            }, {
                onConflict: 'id'
            });

            if (profileError) throw profileError;

            message.style.color = 'green';
            message.textContent = 'Registration successful!';

            window.location.href = 'login.html';

        } else {

            message.style.color = 'green';

            message.textContent =
            'Check your email to confirm your account before logging in.';

            button.disabled = false;
            button.textContent = 'Create Account';
        }

    } catch (error) {

        message.style.color = 'red';
        message.textContent = error.message;

        button.disabled = false;
        button.textContent = 'Create Account';

    }

});

</script>

</body>
</html>
